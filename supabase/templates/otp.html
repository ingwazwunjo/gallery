<!doctype html>
<html lang="th">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6f7f9;
      font-family: Tahoma, &quot;Noto Sans Thai&quot;, sans-serif;
      color: #1f2328;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px 28px">
          <p style="margin: 0 0 8px; font-size: 20px; font-weight: bold">ArtMatch</p>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6">
            รหัสเข้าสู่ระบบของคุณคือ
          </p>
          <p style="margin: 0 0 24px; font-size: 32px; font-weight: bold; letter-spacing: 8px">
            {{ .Token }}
          </p>
          <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.6; color: #57606a">
            รหัสนี้ใช้ได้ภายใน 10 นาที และใช้ได้ครั้งเดียว
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #57606a">
            ถ้าคุณไม่ได้ขอรหัสนี้ ไม่ต้องทำอะไร บัญชีของคุณยังปลอดภัย และอย่าส่งรหัสนี้ให้ใคร
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
